<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12352B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سواری</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12352B; --leaf:#1F8A4C; --mint:#DDF3E5; --saffron:#F2B01E;
  --bg:#F2F6F3; --card:#fff; --text:#17231D; --muted:#66756C; --line:#D9E3DC;
  --danger:#C2402F;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1A15;--card:#16251E;--text:#EAF3ED;--muted:#93A79B;--line:#26382F;--mint:#1B3A2A}
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Baloo 2','Noto Nastaliq Urdu',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
html[lang=ur] body{font-family:'Noto Nastaliq Urdu','Baloo 2',system-ui,sans-serif;line-height:2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

.screen{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.screen.on{display:flex}

/* map */
#map{position:absolute;inset:0;z-index:0}
.menu-btn{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 12px);inset-inline-start:12px;width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px #0003;display:grid;place-items:center}
.menu-btn span{display:block;width:20px;height:2px;background:var(--text);box-shadow:0 6px 0 var(--text),0 -6px 0 var(--text)}
.locate{position:absolute;z-index:500;inset-inline-end:12px;top:calc(env(safe-area-inset-top) + 12px);height:48px;padding:0 16px;border-radius:24px;background:var(--card);box-shadow:0 2px 10px #0003;font-weight:700;color:var(--leaf)}

/* bottom sheet */
.sheet{position:absolute;z-index:600;inset-inline:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px #0003;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
.route{border:2px solid var(--leaf);border-radius:20px;padding:6px 14px}
.row{display:flex;align-items:center;gap:12px;min-height:48px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.dot.a{background:var(--leaf)} .dot.b{background:#7B4DE0}
.row input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:6px 0}
.row + .row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{color:var(--muted);font-size:.9rem;margin:8px 4px 0}

.vehicles{display:flex;gap:10px;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.veh{border:2px solid var(--line);border-radius:18px;padding:10px 4px;text-align:center;background:var(--bg)}
.veh{flex:0 0 92px}
.veh .vi{width:72px;height:54px;object-fit:cover;border-radius:10px;display:block;margin:0 auto 4px}
.veh b{display:block}
.veh small{color:var(--muted)}
.veh[aria-pressed=true]{border-color:var(--leaf);background:var(--mint)}

.fare{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 10px}
.fare strong{font-size:1.6rem;color:var(--leaf)}
.when{display:flex;align-items:center;gap:8px;margin:0 4px 12px;color:var(--muted)}
.when input{flex:1;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--text);font:inherit}

.cta{width:100%;height:56px;border-radius:28px;background:var(--leaf);color:#fff;font-weight:700;font-size:1.15rem}
.cta:disabled{background:var(--line);color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:#0007;z-index:900;display:none}
.scrim.on{display:block}
.drawer{position:fixed;z-index:950;top:0;bottom:0;inset-inline-start:0;width:78%;max-width:320px;background:var(--ink);color:#fff;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
html[dir=ltr] .drawer{transform:translateX(-105%)}
.drawer.on,html[dir=ltr] .drawer.on{transform:none}
.profile{padding:28px 16px 18px;text-align:center;background:#0C261F}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--saffron);color:var(--ink);display:grid;place-items:center;margin:0 auto 8px;font-weight:700;font-size:1.6rem}
.drawer nav button{display:block;width:100%;text-align:start;padding:14px 20px;border-bottom:1px solid #ffffff22;font-size:1.1rem}
.drawer nav button:hover{background:#ffffff14}
.lang{margin-top:auto;padding:20px;display:flex;align-items:center;justify-content:center;gap:12px}
.lang button{padding:8px 18px;border-radius:20px;border:2px solid #ffffff55}
.lang button[aria-pressed=true]{background:var(--saffron);color:var(--ink);border-color:var(--saffron);font-weight:700}

/* bookings */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:2px solid var(--leaf)}
.top h1{font-size:1.2rem;flex:1;text-align:center;font-weight:500}
.back{width:48px;height:48px;font-size:1.6rem;color:var(--leaf)}
html[dir=rtl] .back{transform:scaleX(-1)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:12px 4px;background:var(--line);color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--leaf);color:#fff;font-weight:700}
.list{flex:1;overflow:auto;padding:12px}
.empty{text-align:center;color:var(--muted);margin-top:22vh}
.empty svg{width:140px;opacity:.6}
.empty .cta{width:auto;padding:0 32px;margin-top:14px}
.bk{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.bk .head{display:flex;justify-content:space-between;font-weight:700}
.bk p{color:var(--muted);margin-top:4px}
.bk .acts{display:flex;gap:8px;margin-top:10px}
.bk .acts button{flex:1;height:44px;border-radius:22px;border:2px solid var(--leaf);color:var(--leaf);font-weight:700}
.bk .acts .x{border-color:var(--danger);color:var(--danger)}

.page{flex:1;padding:24px;overflow:auto}
.page .big{font-size:2.2rem;color:var(--leaf);font-weight:700;margin:8px 0 16px}
.page a{color:var(--leaf);font-weight:700}
/* role + driver */
.rolebox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;background:var(--ink);color:#fff;text-align:center}
.rolebox img{width:96px;height:96px;border-radius:24px;margin:0 auto}
.rolebox h1{font-size:1.5rem;font-weight:500;margin-bottom:8px}
.rolebtn{background:var(--card);color:var(--text);border-radius:24px;padding:22px 16px;display:block;width:100%;border:3px solid transparent}
.rolebtn b{display:block;font-size:1.4rem;color:var(--leaf)}
.rolebtn small{color:var(--muted)}
.rolebtn:active{border-color:var(--saffron)}
.dpage{flex:1;overflow:auto;padding:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.dcard h2{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.cta.off{background:var(--muted)}
.state{text-align:center;color:var(--muted);margin:6px 0 0}
.earn{font-size:1.8rem;color:var(--leaf);font-weight:700}
.rider-only{}
body[data-role=driver] .rider-only{display:none}
.fareBox{display:grid;gap:4px;margin:6px 0 10px}
.fareBox button{display:flex;justify-content:space-between;padding:6px 18px;color:var(--muted);font-size:1.05rem}
.fareBox .mid{background:var(--leaf);color:#fff;border-radius:28px;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.3rem}
.radar{position:relative;width:230px;height:230px;margin:20px auto;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;background:#1F8A4C33;animation:pulse 2.4s ease-out infinite}
.radar i:nth-child(2){animation-delay:1.2s}
.radar b{width:60px;height:60px;border-radius:50%;background:var(--leaf)}
@keyframes pulse{from{transform:scale(.3);opacity:1}to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.radar i{animation:none}}
.offer{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 12px 0}
.offer div{flex:1}.offer strong{font-size:1.1rem}
.offer button{width:48px;height:44px;border-radius:12px;font-size:1.3rem}
.offer .ok{background:var(--leaf);color:#fff}.offer .no{background:var(--line)}
.txtin{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px}
.num{width:84px;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);color:var(--text);font:inherit}
.lbl{display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.adstrip{background:#fff;color:var(--ink);padding:14px 16px;text-align:start;width:100%;font-size:.95rem}
.cbtn{flex:1;height:44px;display:grid;place-items:center;border-radius:22px;border:2px solid var(--leaf);color:var(--leaf);font-weight:700;text-decoration:none}
.cbtn.wa{background:#25D366;border-color:#25D366;color:#fff}
.vmark img{width:48px;height:36px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 8px #0006}
#tmap{flex:1;min-height:0}
.tcard{background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -4px 16px #0003;position:relative;z-index:500}
.tcard .tinfo{font-weight:700;font-size:1.05rem;margin-bottom:6px}
.adbar{position:absolute;z-index:480;top:calc(env(safe-area-inset-top) + 68px);inset-inline:12px;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:20px;background:var(--card);color:var(--text);box-shadow:0 2px 10px #0003;overflow:hidden;font-size:.9rem;line-height:1.2;text-align:start}
.adbar[hidden]{display:none}
.adbar small{flex:none;background:var(--saffron);color:var(--ink);border-radius:6px;padding:0 6px;font-weight:700;line-height:1.5}
.adbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adbar.swap span{animation:adfade .5s}
@keyframes adfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.adbar.swap span{animation:none}}
.adbar.img{height:64px}
.adbar img{width:56px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.adbar img[hidden]{display:none}
.adbar.img span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet #book{position:sticky;bottom:0;z-index:2;box-shadow:0 -8px 12px var(--card)}
.toast{position:fixed;z-index:2000;inset-inline:16px;bottom:calc(24px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:14px 18px;border-radius:16px;display:none;text-align:center}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home" aria-label="home">
  <div id="map" aria-label="map"></div>
  <button class="menu-btn" id="openMenu" aria-label="menu"><span></span></button>
  <button class="locate" id="locate" data-t="myLocation"></button>
  <button class="adbar" id="adBar" hidden><small>AD</small><img id="adImg" alt="" hidden><span id="adTxt"></span></button>

  <div class="sheet">
    <div class="route">
      <div class="row"><i class="dot a"></i><div class="txt" id="pickTxt"></div></div>
      <div class="row"><i class="dot b"></i><input id="dropIn" enterkeyhint="search" data-tp="dropPlaceholder"></div>
    </div>
    <p class="hint" data-t="tapHint"></p>

    <input class="txtin" id="rPhone" type="tel" inputmode="tel" data-tp="yourPhone" style="margin:10px 0 0">
    <div class="vehicles" id="vehicles" role="group"></div>

    <div class="fareBox"><button id="fUp"><b id="fHi"></b><span data-t="faster"></span></button><div class="mid"><span data-t="fare"></span><span id="fareVal">—</span></div><button id="fDn"><b id="fLo"></b><span data-t="longer"></span></button></div>
    <label class="when"><span data-t="when"></span><input type="datetime-local" id="whenIn"></label>
    <button class="cta" id="book" data-t="book" disabled></button>
  </div>
</section>

<!-- BOOKINGS -->
<section class="screen" id="bookings">
  <div class="top"><button class="back" data-go="home" aria-label="back">←</button><h1 data-t="bookings"></h1><span style="width:48px"></span></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="scheduled" data-t="scheduled"></button>
    <button role="tab" data-tab="progress" data-t="progress"></button>
    <button role="tab" data-tab="done" data-t="done"></button>
  </div>
  <div class="list" id="bkList"></div>
</section>

<!-- WALLET -->
<section class="screen" id="wallet">
  <div class="top"><button class="back" data-go="home" aria-label="back">←</button><h1 data-t="wallet"></h1><span style="width:48px"></span></div>
  <div class="page"><p data-t="balance"></p><div class="big">Rs. 0</div><p data-t="walletNote"></p></div>
</section>

<!-- CONTACT -->
<section class="screen" id="contact">
  <div class="top"><button class="back" data-go="home" aria-label="back">←</button><h1 data-t="contact"></h1><span style="width:48px"></span></div>
  <div class="page">
    <p data-t="contactNote"></p><br>
    <!-- اپنا نمبر یہاں لکھیں: 92300XXXXXXX -->
    <a id="wa" href="https://wa.me/92300XXXXXXX" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</section>

<!-- SEARCH -->
<section class="screen" id="search">
  <div class="top"><button class="back" id="cancelSearch" aria-label="cancel" style="transform:none">✕</button><h1 data-t="finding"></h1><span style="width:48px"></span></div>
  <div id="offers"></div>
  <div class="radar"><i></i><i></i><b></b></div>
  <div style="padding:0 16px">
    <p class="state" data-t="raiseHint"></p>
    <div class="fareBox"><div class="mid"><span data-t="fare"></span><span id="sFare"></span></div></div>
    <button class="cta" id="raise" data-t="raise"></button>
  </div>
</section>

<!-- ADVERTISE -->
<section class="screen" id="advertise">
  <div class="top"><button class="back" data-go="home" aria-label="back">←</button><h1 data-t="advertise"></h1><span style="width:48px"></span></div>
  <div class="page">
    <div class="dcard"><h2 id="adText"></h2></div>
    <div id="advContact"></div>
    <p data-t="advTitle" style="margin-bottom:10px"></p>
    <input class="txtin" id="advName" data-tp="advName">
    <input class="txtin" id="advPhone" type="tel" data-tp="advPhone">
    <input class="txtin" id="advMsg" data-tp="advMsg">
    <button class="cta" id="advSend" data-t="advSend"></button>
    
  </div>
</section>

<!-- TRACK -->
<section class="screen" id="track">
  <div class="top"><button class="back" id="trackBack" aria-label="back">←</button><h1 data-t="tracking"></h1><span style="width:48px"></span></div>
  <div id="tmap"></div>
  <div class="tcard">
    <div class="tinfo" id="tInfo"></div>
    <div id="tContact"></div>
    <button class="cta" id="tAction" hidden style="margin-top:10px"></button>
  </div>
</section>

<!-- ROLE -->
<section class="screen" id="role">
  <div class="rolebox">
    <img src="icon-192.png" alt="">
    <h1 data-t="chooseRole"></h1>
    <button class="rolebtn" data-role="rider"><b data-t="roleRider"></b><small data-t="roleRiderSub"></small></button>
    <button class="rolebtn" data-role="driver"><b data-t="roleDriver"></b><small data-t="roleDriverSub"></small></button>
  </div>
</section>

<!-- DRIVER -->
<section class="screen" id="driver">
  <div class="top"><button class="back" id="openMenu2" aria-label="menu" style="transform:none">☰</button><h1 data-t="driverHome"></h1><span style="width:48px"></span></div>
  <div class="dpage">
    <div class="dcard">
      <button class="cta off" id="onlineBtn"></button>
      <p class="state" id="onlineState"></p>
    </div>
    <div class="dcard"><h2 data-t="myVehicle"></h2><input id="dNameIn" class="txtin" data-tp="yourName"><input id="dPhoneIn" class="txtin" type="tel" inputmode="tel" data-tp="yourPhone"><div class="vehicles" id="dVehicles" style="margin:0"></div></div>
    <div class="dcard"><h2 data-t="todayEarn"></h2><div class="earn" id="earnVal">Rs. 0</div></div>
    <h2 style="margin:8px 4px" data-t="requests"></h2>
    <div id="reqList"></div>
    <h2 style="margin:8px 4px" data-t="myTrips"></h2>
    <div id="tripList"></div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="menu">
  <div class="profile"><div class="avatar">S</div><div id="whoAmI"></div></div>
  <nav>
    <button data-go="home" data-t="home"></button>
    <button class="rider-only" data-go="bookings" data-t="bookings"></button>
    <button class="rider-only" data-go="wallet" data-t="wallet"></button>
    <button data-go="contact" data-t="contact"></button>
    <button data-go="advertise" data-t="advertise"></button>
  </nav>
  <nav><button id="switchRole" data-t="switchRole"></button></nav>
  <div class="lang">
    <button id="enBtn">English</button>
    <button id="urBtn">اردو</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ ترتیبات (یہاں سے کرایہ بدلیں) ============ */
const VEHICLES = {
  motorcycle:{ base:50,  perKm:20, icon:'motorcycle' },
  rickshaw:  { base:80,  perKm:35, icon:'rickshaw' },

  bus:       { base:500, perKm:90, icon:'bus' }
};
const DEFAULT_CENTER = [31.5204, 74.3587]; // لاہور

/* ============ زبانیں ============ */
const T = {
  ur: {
    myLocation:'میری جگہ', tapHint:'ڈراپ آف کے لیے نقشے پر ٹیپ کریں یا جگہ کا نام لکھیں',
    dropPlaceholder:'ڈراپ آف لکھیں', fare:'اندازاً کرایہ', when:'وقت (اختیاری)', book:'بک کریں',

    guest:'مہمان', rickshaw:'رکشا', chingchi:'چنگ چی', loader:'لوڈر',
    noBooking:'کوئی بکنگ نہیں', bookNow:'ابھی بک کریں', pickup:'پک اپ', locating:'جگہ تلاش ہو رہی ہے…',
    booked:'بکنگ ہو گئی', complete:'مکمل کریں', cancel:'منسوخ', balance:'موجودہ بیلنس',
    walletNote:'ادائیگی ابھی نقد ہے۔ آن لائن والٹ بعد میں شامل ہو گا۔',
    contactNote:'کسی بھی مدد کے لیے ہم سے رابطہ کریں۔', notFound:'جگہ نہیں ملی', pickDrop:'پہلے ڈراپ آف منتخب کریں',
    km:'کلومیٹر',
    chooseRole:'آپ کون ہیں؟', roleRider:'سواری', roleRiderSub:'رکشا، چنگ چی یا لوڈر بک کریں',
    roleDriver:'ڈرائیور', roleDriverSub:'بکنگ قبول کریں اور کمائیں', roleAdmin:'ایڈمن', roleAdminSub:'اشتہار اور سیٹنگز (پن چاہیے)', switchRole:'روپ بدلیں',
    driverHome:'ڈرائیور', goOnline:'آن لائن ہوں', goOffline:'آف لائن ہوں',

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ur' ? 'rtl' : 'ltr';
  $$('[data-t]').forEach(e=> e.textContent = t(e.dataset.t));
  $$('[data-tp]').forEach(e=> e.placeholder = t(e.dataset.tp));
  $('#urBtn').setAttribute('aria-pressed', lang==='ur');
  $('#enBtn').setAttribute('aria-pressed', lang==='en');
  renderVehicles(); renderPick(); renderBookings(); updateFare(); renderDriver();
}
$('#urBtn').onclick = ()=>{ lang='ur'; localStorage.setItem('lang',lang); applyLang(); };
$('#enBtn').onclick = ()=>{ lang='en'; localStorage.setItem('lang',lang); applyLang(); };

/* ============ نقشہ ============ */
const map = L.map('map',{zoomControl:false}).setView(DEFAULT_CENTER, 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let pickM=null, dropM=null, line=null;

function dist(a,b){
  const R=6371, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*1.3; // سڑک کے موڑ کے لیے 1.3
}
async function reverse(lat,lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=${lang}`);
    const j = await r.json();
    return (j.display_name||'').split(',').slice(0,3).join(',') || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  }catch{ return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
}
async function setPickup(lat,lng){
  pickup = {lat,lng,name:''};
  if(pickM) pickM.setLatLng([lat,lng]); else pickM=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#1F8A4C',fillOpacity:1}).addTo(map);
  pickup.name = await reverse(lat,lng); renderPick(); drawRoute();
}
async function setDrop(lat,lng,name){
  drop = {lat,lng,name:name||''};
  if(dropM) dropM.setLatLng([lat,lng]); else dropM=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#7B4DE0',fillOpacity:1}).addTo(map);
  if(!name) drop.name = await reverse(lat,lng);
  $('#dropIn').value = drop.name; drawRoute(); updateFare();
}
function drawRoute(){
  if(line){ map.removeLayer(line); line=null; }
  if(pickup && drop){
    line = L.polyline([[pickup.lat,pickup.lng],[drop.lat,drop.lng]],{color:'#12352B',weight:4,dashArray:'6 8'}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[60,260]});
  }
}
function renderPick(){ $('#pickTxt').textContent = pickup ? (pickup.name || t('locating')) : t('locating'); }
map.on('click', e=> setDrop(e.latlng.lat, e.latlng.lng));

function locate(){
  if(!navigator.geolocation){ setPickup(...DEFAULT_CENTER); return; }
  navigator.geolocation.getCurrentPosition(
    p=>{ map.setView([p.coords.latitude,p.coords.longitude],16); setPickup(p.coords.latitude,p.coords.longitude); },
    ()=>{ setPickup(...DEFAULT_CENTER); },
    {enableHighAccuracy:true,timeout:10000}
  );
}
$('#locate').onclick = locate;

/* ڈراپ آف تلاش */
$('#dropIn').addEventListener('keydown', async e=>{
  if(e.key!=='Enter') return;
  const q = e.target.value.trim(); if(!q) return;
  try{
    const c = map.getCenter();
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}&viewbox=${c.lng-0.3},${c.lat+0.3},${c.lng+0.3},${c.lat-0.3}`);
    const j = await r.json();
    if(!j.length){ toast(t('notFound')); return; }
    setDrop(+j[0].lat,+j[0].lon,q);
  }catch{ toast(t('notFound')); }
  e.target.blur();
});

function renderVehicles(){
  $('#vehicles').innerHTML = Object.keys(VEHICLES).map(k=>
    `<button class="veh" data-v="${k}" aria-pressed="${k===vehicle}">${ICONS[VEHICLES[k].icon]}<b>${t(k)}</b><small>Rs. ${VEHICLES[k].perKm}/${t('km')}</small></button>`
  ).join('');
  $$('.veh').forEach(b=> b.onclick=()=>{ vehicle=b.dataset.v; renderVehicles(); updateFare(); });
}
function fareNow(){
  if(!pickup||!drop) return null;
  const v=VEHICLES[vehicle], d=dist(pickup,drop);
  return { km:d, fare: Math.round((v.base+v.perKm*d)/10)*10 };
}
function updateFare(){
  const f=fareNow();
  if(f){ const key=vehicle+'|'+drop.lat+'|'+drop.lng; if(estKey!==key){ estKey=key; offerFare=f.fare; } } else { estKey=''; offerFare=null; }
  $('#fareVal').textContent = f ? `Rs. ${offerFare}  (${f.km.toFixed(1)} ${t('km')})` : '—';
  $('#fHi').textContent = f ? offerFare+10 : ''; $('#fLo').textContent = f ? Math.max(10,offerFare-10) : '';
  $('#book').disabled = !f;
}

function waNum(n){ n=String(n||'').replace(/\D/g,''); if(n.startsWith('00')) n=n.slice(2); if(n.startsWith('0')) n='92'+n.slice(1); return n; }
function contactBtns(phone){
  const n=waNum(phone); if(!n) return '';
  return `<div class="acts"><a class="cbtn" href="tel:+${n}">📞 ${t('call')}</a><a class="cbtn wa" href="https://wa.me/${n}" target="_blank" rel="noopener">${t('whatsapp')}</a></div>`;
}

/* ============ Supabase ============ */
const SB = 'https://tavqywlzxkkzazxjtofq.supabase.co/rest/v1';
const KEY = 'sb_publishable_WmWHOS56xb4DGWPx1Pr52w_6EVIwm7f';
async function api(path, method='GET', body){
  const r = await fetch(SB+path, { method, headers:{ apikey:KEY, 'Content-Type':'application/json', ...(method==='GET'||path.startsWith('/rpc')?{}:{Prefer:'return=minimal'}) }, body: body?JSON.stringify(body):undefined });
  if(!r.ok) throw new Error(await r.text());
  const tx = await r.text(); return tx ? JSON.parse(tx) : null;
}
const mapB = r => ({ id:+r.id, vehicle:r.vehicle, from:r.from_name, to:r.to_name, fare:r.fare, km:+r.km||0, status:r.status, when:r.when_at||r.created_at,
  accepted:r.accepted, driver:r.driver_name, driverId:r.driver_id, driverDone:r.driver_done, doneAt:r.done_at, riderId:r.rider_id, riderPhone:r.rider_phone, fromLat:r.from_lat, fromLng:r.from_lng, toLat:r.to_lat, toLng:r.to_lng, driverLat:r.driver_lat, driverLng:r.driver_lng, driverTs:r.driver_ts, driverPhone:r.driver_phone, offers:[], rejected:[] });
async function pull(){
  try{
    const [bs,os] = await Promise.all([ api('/bookings?select=*&order=created_at.desc&limit=100'), api('/offers?select=*&order=created_at.asc&limit=500') ]);
    const m = new Map(); bookings = bs.map(r=>{ const b=mapB(r); m.set(b.id,b); return b; });
    os.forEach(o=>{ const b=m.get(+o.booking_id); if(!b) return; b.offers.push({id:+o.id,did:o.driver_id,name:o.driver_name,fare:o.fare,eta:o.eta,trips:o.trips,phone:o.driver_phone}); if(o.rejected) b.rejected.push(+o.id); }); syncGps();
    return true;
  }catch(e){ console.warn(e); return false; }
}
async function mut(fn){ try{ await fn(); await pull(); return true; }catch(e){ console.warn(e); toast(t('netErr')); return false; } }

function tripCard(b, kind){
  const base = `<div class="bk"><div class="head"><span>${t(b.vehicle)}</span><span>Rs. ${b.fare}</span></div><p>${esc(b.from)} → ${esc(b.to)}</p><p>${b.km.toFixed(1)} ${t('km')}</p>`;
  if(kind==='mine'){
    const st=b.status;
    const main = st==='scheduled' ? `<button data-gop="${b.id}">${t('goPickup')}</button>`
      : st==='progress' ? `<button data-trk="${b.id}">${t('openMap')}</button><button data-start="${b.id}">${t('startTrip')}</button>`
      : `<button data-trk="${b.id}">${t('openMap')}</button><button data-fin="${b.id}">${t('finishTrip')}</button>`;
    return base+(b.riderPhone?contactBtns(b.riderPhone):'')+`<div class="acts">${main}</div></div>`;
  }
  if(b.status==='scheduled') return base+`<p>${new Date(b.when).toLocaleString(lang==='ur'?'ur-PK':'en-GB')}</p><div class="acts"><button data-acc="${b.id}">${t('accept')}</button></div></div>`;
  const mo = (b.offers||[]).find(o=>o.did===did);
  if(mo) return base+`<p style="color:var(--leaf);font-weight:700">${t('offerSent')}: Rs. ${mo.fare}</p></div>`;
  return base+`<div class="acts" style="align-items:center"><label class="lbl">Rs<input class="num" type="number" id="of${b.id}" value="${b.fare}"></label><label class="lbl">${t('min')}<input class="num" type="number" id="et${b.id}" value="5"></label><button data-off="${b.id}">${t('sendOffer')}</button></div></div>`;
}

  $$('[data-gop]').forEach(x=> x.onclick=async()=>{ await mut(()=>api('/bookings?id=eq.'+x.dataset.gop,'PATCH',{status:'progress'})); renderDriver(); });

/* ============ ٹریکنگ ============ */
let trackId = null, gpsId = null, lastPush = 0, wl = null, myPos = null, tmap = null, tLayers = {}, lastFit = '';
const activeTrip = ()=> bookings.find(b=>b.driverId===did && (b.status==='progress'||b.status==='ontrip'));
function syncGps(){
  const need = role==='driver' && !!activeTrip();
  if(need && gpsId===null && navigator.geolocation){
    gpsId = navigator.geolocation.watchPosition(onPos, ()=>{}, {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
    if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{});
  } else if(!need && gpsId!==null){
    navigator.geolocation.clearWatch(gpsId); gpsId=null; myPos=null;
    if(wl){ wl.release().catch(()=>{}); wl=null; }
  }
}
function onPos(p){
  myPos = { lat:p.coords.latitude, lng:p.coords.longitude };
  const tr = activeTrip(); if(!tr) return;
  if(Date.now()-lastPush >= 4000){
    lastPush = Date.now();
    api('/bookings?id=eq.'+tr.id,'PATCH',{driver_lat:myPos.lat, driver_lng:myPos.lng, driver_ts:new Date().toISOString()}).catch(()=>{});
  }
  if($('#track').classList.contains('on')) renderTrack();
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && gpsId!==null && navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{});
});

function vIcon(v){ return L.divIcon({className:'vmark', html:`<img src="${IMG[v]||''}" alt="">`, iconSize:[48,36], iconAnchor:[24,18]}); }
function ensureTmap(){
  if(!tmap){
    tmap = L.map('tmap',{zoomControl:false}).setView(DEFAULT_CENTER, 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(tmap);
  }
  setTimeout(()=>tmap.invalidateSize(),50);
}
function setLayer(key, make, pos){
  if(!pos){ if(tLayers[key]){ tmap.removeLayer(tLayers[key]); delete tLayers[key]; } return; }
  if(tLayers[key]) tLayers[key].setLatLng([pos.lat,pos.lng]); else tLayers[key] = make().addTo(tmap);
}
function renderTrack(){
  const b = bookings.find(x=>x.id===trackId);
  const isDriver = role==='driver';
  if(!b){ go(isDriver?'driver':'bookings'); return; }
  if(b.status==='done'){
    toast(t('tripDone')+' · Rs. '+b.fare); trackId=null;
    if(isDriver) go('driver'); else { tab='done'; go('bookings'); }
    return;
  }
  ensureTmap();
  const pick = b.fromLat!=null ? {lat:b.fromLat,lng:b.fromLng} : null;
  const dest = b.toLat!=null ? {lat:b.toLat,lng:b.toLng} : null;
  const who = isDriver ? myPos : (b.driverLat!=null ? {lat:b.driverLat,lng:b.driverLng} : null);
  const fresh = isDriver || (b.driverTs && Date.now()-new Date(b.driverTs).getTime() < 60000);
  setLayer('pick', ()=>L.circleMarker([0,0],{radius:9,color:'#fff',weight:3,fillColor:'#1F8A4C',fillOpacity:1}), pick);
  setLayer('dest', ()=>L.circleMarker([0,0],{radius:9,color:'#fff',weight:3,fillColor:'#7B4DE0',fillOpacity:1}), dest);
  setLayer('who', ()=>L.marker([0,0],{icon:vIcon(b.vehicle)}), who);
  const target = b.status==='ontrip' ? dest : pick;
  if(tLayers.line){ tmap.removeLayer(tLayers.line); delete tLayers.line; }
  if(who && target) tLayers.line = L.polyline([[who.lat,who.lng],[target.lat,target.lng]],{color:'#12352B',weight:4,dashArray:'6 8'}).addTo(tmap);
  const fk = b.id+'|'+b.status+'|'+(who?1:0);
  if(fk!==lastFit){
    lastFit = fk;
    const pts = [pick,dest,who].filter(Boolean).map(p=>[p.lat,p.lng]);
    if(pts.length>1) tmap.fitBounds(pts,{padding:[50,50]}); else if(pts.length) tmap.setView(pts[0],15);
  }
  let info = b.status==='ontrip' ? t('onTrip') : (isDriver ? t('toPickup') : t('driverComing'));
  if(who && target && fresh){
    const d = dist(who,target);
    info += ` · ${d.toFixed(1)} ${t('km')} · ~${Math.max(1,Math.ceil(d/25*60))} ${t('min')}`;
  } else if(!isDriver && b.status==='progress') info += ' · ' + t('waitLoc');
  $('#tInfo').textContent = info;
  const ph = isDriver ? b.riderPhone : b.driverPhone;
  $('#tContact').innerHTML = (!isDriver && b.driver ? `<p>${esc(b.driver)}</p>` : '') + (ph ? contactBtns(ph) : '');
  const btn = $('#tAction');
  btn.hidden = !isDriver;
  if(isDriver) btn.textContent = b.status==='ontrip' ? t('finishTrip') : t('startTrip');
  btn.onclick = async ()=>{
    const patch = b.status==='ontrip'
      ? {status:'done', driver_done:true, done_at:new Date().toISOString(), driver_lat:null, driver_lng:null}
      : {status:'ontrip', started_at:new Date().toISOString()};
    await mut(()=>api('/bookings?id=eq.'+b.id,'PATCH',patch));
    renderTrack();
  };
}
$('#trackBack').onclick = ()=>{ if(role==='driver') go('driver'); else { tab='progress'; go('bookings'); } };

/* ============ ڈرائیور الرٹ (لاک اسکرین پش + آواز) ============ */
const VAPID_PUBLIC = 'BIM_MZKdIPHiYCUkxzcz60Cmj3d57yr44CEGRBeHFzRxYqIa1DvP5JZgUYw0D0ZSgtKT8jQl6BqOU2GfH93di5g';
function b64ToU8(b){ const p='='.repeat((4-b.length%4)%4); const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function rpc(fn, body){
  const r = await fetch(SB+'/rpc/'+fn, { method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
}
function pushToast(msg){ try{ const d=document.createElement('div'); d.textContent=msg; d.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:99;background:#12352B;color:#fff;padding:12px 14px;border-radius:12px;text-align:center;font-size:.95rem'; document.body.appendChild(d); setTimeout(()=>d.remove(),5000); }catch(e){} }
/* ask=true: آن لائن بٹن دبانے پر اجازت مانگیں؛ false: صرف پہلے سے ملی اجازت پر چپکے سے تازہ کریں */
async function pushRegister(ask){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){ if(ask) pushToast(t('pushNo')); return; }
    let perm = Notification.permission;
    if(perm==='default' && ask) perm = await Notification.requestPermission();
    if(perm!=='granted'){ if(ask) pushToast(t('pushDenied')); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await rpc('push_register', { p_did:did, p_vehicle:dVeh, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth });
    if(ask) pushToast(t('pushOn'));
  }catch(e){ console.warn('push', e); if(ask) pushToast(t('pushFail')); }
}
async function pushUnregister(){
  try{
    await rpc('push_unregister', { p_did:did });
    if('serviceWorker' in navigator){ const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }
  }catch(e){ console.warn('push off', e); }
}
/* ایپ کھلی ہو تو نئی بکنگ پر آواز اور وائبریشن */
let actx = null, seenB = null;
function unlockBeep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  try{ navigator.vibrate && navigator.vibrate([250,100,250,100,250]); }catch(e){}
  try{ unlockBeep(); if(!actx) return; [0,0.35,0.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=0.25; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.2); }); }catch(e){}
}
function checkNewForDriver(){
  if(role!=='driver' || !online){ seenB=null; return; }
  const open = bookings.filter(b=>!b.accepted && b.status!=='done' && b.vehicle===dVeh && (b.status==='scheduled' || b.id>Date.now()-600000));
  const ids = new Set(open.map(b=>b.id));
  if(seenB && open.some(b=>!seenB.has(b.id))) beep();
  seenB = ids;
}
if(online) pushRegister(false);

/* ہر چند سیکنڈ میں سرور سے تازہ ڈیٹا */
let lastSig = '';
async function tick(){
  if(document.hidden) return;
  if(!await pull()) return;
  const sig = JSON.stringify(bookings); if(sig===lastSig) return; lastSig = sig; showAd(); checkNewForDriver();
  if($('#driver').classList.contains('on')) renderDriver();
  if($('#bookings').classList.contains('on')) renderBookings();
  if($('#search').classList.contains('on')) renderSearch();
  if($('#track').classList.contains('on')) renderTrack();
}
setInterval(tick, 2500); tick(); loadCfg();

/* ============ شروع ============ */
applyLang();
if(role==='driver'||role==='rider') setRole(role);
else $$('.screen').forEach(s=>s.classList.toggle('on', s.id==='role'));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
